name: Bug
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    attributes: {label: Qué pasó, description: Qué esperabas y qué ocurrió. Pega el error si lo hay.}
    validations: {required: true}
  - type: textarea
    attributes: {label: Cómo reproducirlo, description: Pasos, tipo de foto (resolución, luz), perfil elegido.}
    validations: {required: true}
  - type: input
    attributes: {label: Sistema, placeholder: "macOS 15 · Apple M4 · Python 3.11 · uv 0.7"}
  - type: checkboxes
    attributes:
      label: Confirmación
      options:
        - label: No adjunto fotos de personas reales sin su consentimiento
          required: true
