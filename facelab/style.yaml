# Reglas de contraste personal (Russell 2009; práctica de estilismo): la ropa repite el nivel de contraste de la cara.
contrast_rules:
  high: Combina claros y oscuros en el mismo conjunto (camisa blanca con chaqueta marino, negro con marfil). Los conjuntos monocromos medios apagan.
  medium: Un neutro más un color, o dos tonos con diferencia moderada. Evita el blanco óptico junto al negro puro cerca de la cara.
  low: Tonos sobre tonos y combinaciones suaves en la misma familia. El contraste fuerte (blanco/negro) domina la cara.

face_shapes:
  oval:
    name: Ovalada
    criteria: Largo aproximadamente 1,4–1,6 veces el ancho; pómulos algo más anchos que mandíbula y frente; mentón redondeado.
    haircuts:
      masculine: [Corte clásico con laterales cortos y volumen moderado arriba (side part o quiff bajo), Crew cut con textura, Medio con raya lateral y flequillo hacia atrás]
      feminine: [Media melena a los hombros con ondas suaves, Bob a la mandíbula con raya en medio, Largo con capas ligeras y flequillo cortina]
      neutral: [Corte medio con textura y flequillo abierto, Mullet suave con capas, Rapado corto uniforme]
    beard: [Barba de 3 días perfilada, Barba corta completa siguiendo la mandíbula natural]
    glasses: [Casi cualquier montura; cuadradas o rectangulares añaden estructura, redondas suavizan; ancho igual al de la cara]
    necklines: [Cuello camisero, cuello redondo y pico funcionan; ajustar al largo del cuello]
    accessories: [Sin restricciones; sombreros de ala media y gorras estructuradas]
    avoid: [Flequillos muy pesados que acortan la cara]
  round:
    name: Redonda
    criteria: Largo y ancho similares; pómulos anchos; mandíbula y mentón suaves sin ángulos.
    haircuts:
      masculine: [Volumen y altura arriba con laterales muy cortos (pompadour o quiff alto), Undercut con raya lateral marcada, Evitar flequillo recto y cortes redondeados]
      feminine: [Largo por debajo del hombro con capas que empiezan bajo la barbilla, Bob largo asimétrico (lob) con raya lateral, Volumen en la coronilla y flequillo lateral largo]
      neutral: [Corte con altura arriba y laterales pegados, Capas largas con raya lateral, Moño alto o coleta alta]
    beard: [Barba más larga en el mentón y corta en las mejillas (alarga), Perilla o barba en ancla]
    glasses: [Monturas angulares rectangulares o cuadradas, algo más anchas que la cara; evitar redondas pequeñas]
    necklines: [Cuello en pico y cuello camisero abierto (alargan); evitar cuello redondo cerrado y cuello alto]
    accessories: [Pendientes largos, collares largos, sombreros con copa alta]
    avoid: [Cortes a la altura de la barbilla, volumen en los laterales, flequillo recto]
  square:
    name: Cuadrada
    criteria: Mandíbula tan ancha como los pómulos y la frente; ángulos mandibulares marcados; mentón ancho.
    haircuts:
      masculine: [Textura y movimiento arriba con laterales en degradado (no líneas rectas), Corte medio despeinado, Buzz cut si se quiere subrayar la angulosidad]
      feminine: [Capas largas y ondas sueltas que suavizan la mandíbula, Lob con puntas hacia dentro por debajo de la mandíbula, Flequillo cortina o lateral]
      neutral: [Medio con capas y raya lateral, Rizos o textura suelta alrededor de la cara, Evitar bob recto a la mandíbula]
    beard: [Barba corta redondeada en el mentón (suaviza), Barba de 3 días uniforme; evitar cuadrar el contorno]
    glasses: [Redondas u ovaladas, montura fina; evitar rectangulares gruesas]
    necklines: [Cuello redondo y cuello barco (suavizan); pico moderado]
    accessories: [Pendientes redondos o de gota, bufandas con caída suave]
    avoid: [Bob recto a la altura de la mandíbula, líneas geométricas duras junto a la cara]
  oblong:
    name: Alargada
    criteria: Largo claramente superior a 1,6 veces el ancho; frente, pómulos y mandíbula de anchura similar.
    haircuts:
      masculine: [Laterales con algo de volumen y poca altura arriba, Flequillo hacia delante o texturizado, Evitar pompadour alto]
      feminine: [Flequillo recto o cortina (acorta), Media melena con volumen a los lados y ondas, Evitar largo liso sin capas]
      neutral: [Corte medio con volumen lateral, Flequillo completo, Rizos con anchura]
    beard: [Barba más llena en las mejillas y corta en el mentón (ensancha); evitar perilla larga]
    glasses: [Monturas anchas y profundas (grandes), con puente bajo; evitar pequeñas y estrechas]
    necklines: [Cuello redondo, cuello alto y cuello barco (acortan); evitar pico profundo]
    accessories: [Pendientes de botón o aro, sombreros de ala ancha y copa baja, bufandas anchas]
    avoid: [Altura en la coronilla, pelo largo liso sin flequillo, pico profundo]
  heart:
    name: Corazón
    criteria: Frente y pómulos más anchos que la mandíbula; mentón estrecho o en punta.
    haircuts:
      masculine: [Medio con volumen en la nuca y laterales medios, Flequillo texturizado que reduce la frente, Evitar laterales rapados con mucha altura]
      feminine: [Bob o lob a la altura de la mandíbula con puntas hacia fuera (equilibra), Flequillo cortina o lateral, Ondas desde la barbilla]
      neutral: [Corte con peso en la parte baja, Flequillo abierto, Media melena con textura en puntas]
    beard: [Barba completa que ensancha la mandíbula, Barba corta con contorno inferior amplio]
    glasses: [Monturas más anchas abajo que arriba (aviador, redondas ligeras), sin cejas gruesas en la montura]
    necklines: [Cuello barco y cuello redondo amplio; pico suave]
    accessories: [Pendientes de gota o candelabro que aportan anchura abajo]
    avoid: [Volumen en la coronilla, flequillo recto corto, monturas cat-eye pesadas]
  diamond:
    name: Diamante
    criteria: Pómulos claramente más anchos que frente y mandíbula; mentón estrecho.
    haircuts:
      masculine: [Textura y flequillo hacia delante para ensanchar la frente, Laterales medios no rapados, Medio con ondas]
      feminine: [Flequillo cortina o lateral, Bob a la mandíbula con volumen en las puntas, Recogidos con mechones sueltos]
      neutral: [Flequillo, capas que empiezan en la barbilla, volumen en la nuca]
    beard: [Barba completa de longitud media que ensancha la mandíbula]
    glasses: [Ovaladas, cat-eye suave o con detalle en la parte superior; evitar estrechas]
    necklines: [Cuello barco y camisero abierto]
    accessories: [Pendientes de botón, pañuelos al cuello]
    avoid: [Laterales rapados que acentúan los pómulos, moños tirantes]
  triangle:
    name: Triangular
    criteria: Mandíbula más ancha que la frente y los pómulos.
    haircuts:
      masculine: [Volumen y anchura arriba (quiff, textura), laterales medios; evitar rapados que estrechan la parte alta]
      feminine: [Volumen en la coronilla y las sienes, capas cortas arriba, flequillo lateral con cuerpo]
      neutral: [Corte con peso arriba y ligero en la nuca, ondas desde la raíz]
    beard: [Barba muy corta o afeitado; si hay barba, mínima en los laterales]
    glasses: [Monturas con detalle superior (browline, cat-eye) que ensanchan la frente]
    necklines: [Cuello en pico y cuello camisero; evitar cuello barco]
    accessories: [Pendientes cortos, sombreros con ala]
    avoid: [Volumen a la altura de la mandíbula, barba ancha]

# Palancas visuales de expresión (no son reglas de identidad; describen qué rasgos lee la mayoría como más femeninos o masculinos).
expression:
  feminine:
    summary: Mayor contraste facial (ojos y labios más oscuros que la piel), piel lisa y luminosa, cejas más altas y arqueadas, pelo con longitud o suavidad que enmarca la cara, líneas curvas en cuellos, monturas y accesorios.
    levers: [Pelo con longitud o capas suaves alrededor de la cara, Cejas arqueadas y definidas, Pestañas y labios más marcados (contraste), Piel luminosa y uniforme, Cuellos abiertos o curvos (barco, corazón), Monturas redondeadas o cat-eye, Pendientes y collares finos, Tejidos con caída y colores algo más claros o suaves]
    sources: [Russell 2009 Perception, Jones et al. 2015 Vision Research, Perrett 1998 Nature]
  masculine:
    summary: Menor contraste facial, piel mate, cejas más rectas y bajas, mandíbula subrayada por barba o por líneas rectas, pelo corto con estructura, ángulos en cuellos, monturas y accesorios.
    levers: [Laterales cortos y estructura arriba, Cejas rectas y densas sin depilar el arco, Barba o sombra de barba que cuadra la mandíbula, Piel mate, Cuello camisero estructurado o cuello alto, Monturas rectangulares o de ceja gruesa, Reloj y accesorios de líneas rectas, Tejidos con cuerpo y colores oscuros o neutros]
    sources: [Dixson & Brooks 2013 Evolution and Human Behavior, Russell 2009, Perrett 1998]
  neutral:
    summary: Equilibrio entre las dos listas; textura y proporción por encima de códigos de género.
    levers: [Corte medio con textura, Cejas naturales peinadas, Piel cuidada sin acabado marcado, Cuello redondo o camisero relajado, Monturas ovaladas o redondas finas, Colores neutros con un acento de la paleta]
    sources: [Práctica de estilismo]

# Prendas y accesorios: qué decide cada elección.
garment_rules:
  shirts: El color junto a la cara manda; la primera capa (camisa, camiseta, jersey) en un color de la paleta y el escote según la forma de cara y el largo de cuello.
  outerwear: Neutros de la paleta para chaquetas y abrigos; la estructura del hombro compensa una cara ancha (hombro suave) o estrecha (hombro marcado).
  trousers: Menos crítico para la cara; neutros de la paleta, un tono más oscuro que la parte superior si el contraste personal es medio-alto.
  patterns: Escala del estampado proporcional al tamaño de los rasgos; contraste del estampado igual al contraste personal.
  glasses: Ancho de la montura igual al de la cara a la altura de las sienes; la línea superior sigue la ceja; el color en la familia del pelo o en un neutro de la paleta.
  jewelry_metals: Metal según subtono (plata para frío, oro para cálido, ambos para neutro); tamaño proporcional a los rasgos.
  hats: Ala y copa compensan la forma (copa alta para redonda, ala ancha para alargada).
  hair_color: Nunca más de dos tonos respecto al natural sin cambiar cejas; el subtono del tinte sigue al de la piel.
