# Base de conocimiento de colorimetría y estilo.
# Estaciones: sistema de 12 (Jackson 1980 "Color Me Beautiful"; refinado en Sci/ART y en la práctica actual de análisis de color).
# Formas de cara y cortes: manuales de peluquería y óptica (regla de compensación: el corte/montura añade lo que falta y no repite lo que sobra).
# Expresión femenina/masculina: Russell 2009 (contraste facial), Perrett 1998 (dimorfismo), Dixson & Brooks 2013 (barba), Jones 2015 (maquillaje y contraste).
# Todo es orientativo: la lectura de color depende de la luz y del balance de blancos de la foto.

