# Base de métodos no quirúrgicos (semilla). Cada entrada: qué aborda, evidencia, coste, frecuencia, horizonte, dificultad.
# evidence: A = ensayos controlados / metaanálisis; B = estudios observacionales o pequeños ECA; C = consenso clínico / plausible.
# Nada de esto es consejo médico; los principios activos se consultan con dermatólogo si hay dudas o piel sensible.
- id: retinoid_night
  name: Retinoide tópico nocturno (retinol 0,3–0,5 % o adapaleno 0,1 %)
  addresses: [skin_texture, fine_lines, pores, acne, uneven_tone]
  evidence: A
  sources: ["Kang et al. 1995 (tretinoína, fotoenvejecimiento)", "Mukherjee et al. 2006 (revisión retinoides)"]
  cost_usd: "15–40 / mes"
  frequency: "noches alternas 2 semanas, luego cada noche"
  horizon: "8–12 semanas"
  difficulty: medium
  caution: "irritación inicial; no combinar con ácidos las primeras semanas; fotoprotección obligatoria"
- id: sunscreen_daily
  name: Fotoprotector SPF 30–50 diario
  addresses: [uneven_tone, hyperpigmentation, fine_lines, skin_aging, redness]
