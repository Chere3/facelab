  sources: ["Hughes et al. 2013 (Ann Intern Med, uso diario y envejecimiento)"]
  cost_usd: "10–25 / mes"
  frequency: "cada mañana"
  horizon: "inmediato (prevención), 3–6 meses (tono)"
  difficulty: easy
